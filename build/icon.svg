<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a070ff"/>
      <stop offset="1" stop-color="#631bff"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a070ff"/>
      <stop offset="1" stop-color="#7c3dff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#631bff" stroke-opacity="0.1" stroke-width="1"/>
    </pattern>
    <filter id="glyphBloom" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <filter id="edgeBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="#000000"/>
  <rect width="512" height="512" fill="url(#grid)"/>

  <rect x="8" y="8" width="496" height="496" fill="none" stroke="#631bff" stroke-width="16"
        opacity="0.55" filter="url(#edgeBloom)"/>
  <rect x="8" y="8" width="496" height="496" fill="none" stroke="url(#edge)" stroke-width="16"/>

  <g filter="url(#glyphBloom)" opacity="0.9">
    <path d="M91 177 L205 252 L91 327" fill="none" stroke="#7c3dff" stroke-width="42"
          stroke-linecap="square" stroke-linejoin="miter"/>
    <rect x="269" y="324" width="176" height="42" fill="#7c3dff"/>
  </g>
  <g>
    <path d="M91 177 L205 252 L91 327" fill="none" stroke="url(#glyph)" stroke-width="36"
          stroke-linecap="square" stroke-linejoin="miter"/>
    <rect x="269" y="324" width="176" height="36" fill="url(#glyph)"/>
  </g>
</svg>
